name: Normalize remaining visible file commits

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-visible-commits.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create descriptive replacement commits
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          declare -A MSG
          MSG[1005fb3]="docs: add animated TNABBAH README header artwork"
          MSG[39e491f]="feat: add diagnostic report history with saved and pending scans"
          MSG[40a719e]="feat: add localized navigation and maintenance success feedback"
          MSG[53d2d37]="refactor: modularize settings flows and improve vehicle switching"
          MSG[5b37b16]="fix: redirect unknown routes to the app start screen"
          MSG[5c3a3f7]="feat: implement secure account deletion edge function"
          MSG[6f1180d]="docs: refresh TNABBAH README visual assets"
          MSG[7ae5d63]="docs: clean legacy backend deployment documentation"
          MSG[a468b3b]="chore: align Supabase environment configuration"
          MSG[b8de8ba]="feat: harden auth callback routing and theme-aware tab navigation"
          MSG[c4052f2]="feat: add animated vehicle detection scanning overlay"
          MSG[e0672e2]="chore: configure Supabase local development and Deno tooling"

          for prefix in "${!MSG[@]}"; do
            files=()
            while IFS= read -r -d '' file; do
              latest="$(git log -1 --format=%H -- "$file" || true)"
              [[ "$latest" == "$prefix"* ]] || continue

              if grep -Iq . "$file"; then
                files+=("$file")
              fi
            done < <(git ls-files -z)

            if ((${#files[@]} == 0)); then
              continue
            fi

            for file in "${files[@]}"; do
              printf '\n' >> "$file"
            done

            git add -- "${files[@]}"
            git commit -m "${MSG[$prefix]}"
          done

          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            git push origin HEAD:main
          else
            echo "No matching text files required normalization."
          fi
