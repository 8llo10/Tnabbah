name: Verify visible file commits

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-visible-commits.yml'

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit latest commit messages for text files
        shell: bash
        run: |
          python - <<'PY'
          import os, re, subprocess

          def git(*args):
              return subprocess.check_output(['git', *args], text=True, errors='replace').strip()

          files = git('ls-files', '-z').split('\0')
          exact_bad = {
              'demo', 'docs', 'docx', 'gg', 'g', 'x', 'k', 'm', 'ء', 'ءء', 'ءءء', 'ؤؤ', 'ؤؤؤؤؤ',
              'last thing', 'cleeennn', 'delete', 'tray to debloyy', 'reade me faile',
              'update reademe', 'updating readme file', 'editing teemwoork!!!', 'contact us **',
              'wep version1', 'wep version2', 'wep version3', 'تعديل', 'تعديلات هووووو',
              'محاولات تبديل السيارات', 'نفسي انام', 'ربط الصفحة بنظام الفحص',
          }
          generic_file_update = re.compile(r'^update\s+[^\s]+\.(?:tsx?|jsx?|json|md|html|css|svg)$', re.I)
          punctuation = re.compile(r'^[\W_\d]+$', re.UNICODE)

          found = []
          for path in files:
              if not path or not os.path.isfile(path):
                  continue
              try:
                  data = open(path, 'rb').read(8192)
              except OSError:
                  continue
              if b'\x00' in data:
                  continue
              sha = git('log', '-1', '--format=%H', '--', path)
              subject = git('log', '-1', '--format=%s', '--', path)
              s = subject.strip()
              low = s.lower()
              arabic = any('\u0600' <= ch <= '\u06ff' for ch in s)
              bad = (
                  not s
                  or low in exact_bad
                  or punctuation.fullmatch(s) is not None
                  or generic_file_update.fullmatch(s) is not None
                  or arabic
              )
              if bad:
                  found.append((sha, subject, path))

          if not found:
              print('AUDIT_CLEAN: no remaining text files with non-descriptive latest commits')
          else:
              for sha, subject, path in sorted(found, key=lambda x: (x[0], x[2])):
                  print(f'UNRESOLVED|{sha}|{subject}|{path}')
              print(f'UNRESOLVED_COUNT={len(found)}')
          PY
